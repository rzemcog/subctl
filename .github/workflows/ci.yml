name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q --junitxml=pytest-results.xml
      - name: Report failed test names
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          for case in root.iter("testcase"):
              if case.find("failure") is not None or case.find("error") is not None:
                  nodeid = ".".join(
                      value for value in (case.get("classname"), case.get("name")) if value
                  )
                  print(f"::error title=pytest failure::{nodeid}")
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Reject public-repository hazards
        shell: bash
        run: |
          bash scripts/check-public-hygiene.sh
