name: Update pinned Mihomo

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Resolve latest stable Mihomo release
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          request = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "subctl-mihomo-pin-updater",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          tag = release.get("tag_name")
          if not isinstance(tag, str) or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("latest Mihomo release is not a stable semantic version")
          asset_name = f"mihomo-linux-amd64-compatible-{tag}.gz"
          asset = next(
              (item for item in release.get("assets", []) if item.get("name") == asset_name),
              None,
          )
          digest = asset.get("digest") if asset else None
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("latest Mihomo release has no verified SHA-256 asset digest")

          pin = {
              "tag": tag,
              "asset": asset_name,
              "sha256": digest.removeprefix("sha256:"),
          }
          Path(".github/mihomo-pin.json").write_text(
              json.dumps(pin, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Verify updated pin and test current application
        run: |
          python scripts/download-mihomo.py --output "$RUNNER_TEMP/mihomo"
          MIHOMO_BIN="$RUNNER_TEMP/mihomo" pytest -q -m mihomo_integration
          pytest -q -m "not mihomo_integration"
      - name: Open or update the pin pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .github/mihomo-pin.json; then
            echo "Mihomo pin is current"
            exit 0
          fi
          version=$(python -c 'import json; print(json.load(open(".github/mihomo-pin.json"))["tag"])')
          branch=automation/update-mihomo-pin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add .github/mihomo-pin.json
          git commit -m "Update pinned Mihomo to $version"
          remote_sha=$(git ls-remote --heads origin "$branch" | cut -f1)
          if [[ -n "$remote_sha" ]]; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push --force-with-lease="refs/heads/$branch:" origin "$branch"
          fi
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/", 1)[0]
          branch = "automation/update-mihomo-pin"
          tag = json.load(open(".github/mihomo-pin.json", encoding="utf-8"))["tag"]
          base = f"https://api.github.com/repos/{repository}/pulls"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "subctl-mihomo-pin-updater",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          query = urllib.parse.urlencode(
              {"state": "open", "head": f"{owner}:{branch}", "base": "main"}
          )
          request = urllib.request.Request(f"{base}?{query}", headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              pull_requests = json.load(response)

          title = f"Update pinned Mihomo to {tag}"
          body = (
              f"Updates the pinned official Mihomo binary to version {tag}.\n\n"
              "The updater verified the release asset SHA-256 and ran the full Python suite "
              "plus all Mihomo integration tests against this binary before opening this PR."
          )
          if pull_requests:
              number = pull_requests[0]["number"]
              payload = {"title": title, "body": body}
              request = urllib.request.Request(
                  f"{base}/{number}",
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="PATCH",
              )
          else:
              payload = {
                  "title": title,
                  "body": body,
                  "head": branch,
                  "base": "main",
              }
              request = urllib.request.Request(
                  base,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST",
              )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull_request = json.load(response)
          print(f"Mihomo pin update PR #{pull_request['number']} is ready")
          PY
