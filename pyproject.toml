[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subctl"
version = "0.1.0"
description = "CLI and Web UI for managing generated VPN subscription profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27,<1",
]

[project.scripts]
subctl = "subctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subctl = ["web_dist/*", "web_dist/assets/*"]
