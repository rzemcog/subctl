proxy-providers:
  private:
    type: http
    url: https://panel.example.com/sub/alice
    proxy: FETCH-PRIVATE
    interval: 3600
    path: ./providers/private.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 15
      timeout: 3000
      lazy: true
  provider:
    type: http
    url: https://sub.example.com/feeds/provider/provider_shared_token_1234567890abcd
    proxy: FETCH-AUTO-PROVIDER
    interval: 900
    path: ./providers/provider.yaml
    exclude-filter: (?i)(?:Киев|Москва)
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 15
      timeout: 3000
      lazy: true
    header:
      User-Agent:
      - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/154.0.0.0 Safari/537.36
  provider-seed:
    type: inline
    payload:
    - name: fixture-seed
      type: vless
      server: seed.example.net
      port: 443
      uuid: 123e4567-e89b-12d3-a456-426614174000
      network: tcp
      encryption: ''
      flow: xtls-rprx-vision
      tls: true
      servername: seed.example.net
      client-fingerprint: chrome
      reality-opts:
        public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        short-id: 0123456789abcdef
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 15
      timeout: 3000
      lazy: true
proxy-groups:
- name: PRIVATE
  type: select
  use:
  - private
  empty-fallback: REJECT
- name: PROVIDER-AUTO
  type: fallback
  proxies:
  - PROVIDER-AUTO-LIVE
  - PROVIDER-AUTO-SEED
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  lazy: true
- name: AUTO
  type: fallback
  proxies:
  - PRIVATE
  - PROVIDER-AUTO
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  lazy: true
- name: PROXY
  type: select
  proxies:
  - AUTO
  - PRIVATE
  - PROVIDER-AUTO
  - DIRECT
- name: BASE
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: PROVIDER-AUTO-LIVE
  type: url-test
  use:
  - provider
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  tolerance: 50
  lazy: true
- name: PROVIDER-AUTO-SEED
  type: url-test
  use:
  - provider-seed
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  tolerance: 50
  lazy: true
- name: FETCH-PRIVATE
  type: fallback
  proxies:
  - PROVIDER-AUTO-SEED
  - DIRECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  lazy: true
  hidden: true
- name: FETCH-AUTO-PROVIDER
  type: fallback
  proxies:
  - PRIVATE
  - PROVIDER-AUTO-SEED
  - DIRECT
  url: https://www.gstatic.com/generate_204
  interval: 15
  timeout: 3000
  max-failed-times: 2
  lazy: true
  hidden: true
- name: GLOBAL
  type: select
  proxies:
  - PRIVATE
  - PROVIDER-AUTO
  - AUTO
  - PROXY
  - BASE
  - PROVIDER-AUTO-LIVE
  - PROVIDER-AUTO-SEED
  - FETCH-PRIVATE
  - FETCH-AUTO-PROVIDER
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,::1/128,DIRECT,no-resolve
- IP-CIDR,fc00::/7,DIRECT,no-resolve
- IP-CIDR,fe80::/10,DIRECT,no-resolve
- MATCH,BASE
